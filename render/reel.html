<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--acc:#34E3C8;--warn:#F4746B}
  html,body{background:#0B0D10}
  #stage{position:relative;width:1080px;height:1920px;background:#0B0D10;overflow:hidden;
    font-family:Inter,system-ui,sans-serif;color:#F4F4F5;-webkit-font-smoothing:antialiased}
  .grain{position:absolute;inset:0;opacity:.035;
    background:radial-gradient(circle at 30% 20%,var(--acc) 0,transparent 42%),radial-gradient(circle at 75% 80%,#2b6cff 0,transparent 45%)}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:0 110px;opacity:0;will-change:opacity,transform}
  .scene.top{justify-content:flex-start;padding-top:330px}
  .kick{font-size:34px;font-weight:600;letter-spacing:.3em;color:#8A8F98;text-transform:uppercase}
  .h1{font-size:112px;font-weight:900;line-height:1.03;letter-spacing:-.02em}
  .h2{font-size:92px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .big{font-size:250px;font-weight:900;line-height:.9;letter-spacing:-.03em}
  .sub{font-size:46px;font-weight:500;line-height:1.3;color:#C4C7CC}
  .acc{color:var(--acc)}
  .warn{color:var(--warn)}
  .mut{color:#8A8F98}
  .barwrap{display:flex;align-items:flex-end;gap:70px;height:600px;margin-top:90px}
  .barcol{display:flex;flex-direction:column;align-items:center;gap:26px;width:260px}
  .bar{width:200px;border-radius:18px 18px 4px 4px}
  .barlbl{font-size:36px;font-weight:600;color:#C4C7CC;text-align:center}
  .barval{font-size:52px;font-weight:900}
  .risk{display:flex;align-items:center;gap:34px;font-size:58px;font-weight:700;margin:22px 0}
  .dot{width:26px;height:26px;border-radius:50%;flex:none}
  .cap{position:absolute;left:110px;right:110px;bottom:150px;font-size:50px;font-weight:700;line-height:1.25}
  .capbar{position:absolute;left:110px;bottom:132px;width:0;height:6px;background:var(--acc);border-radius:3px}
  #prog{position:absolute;left:0;bottom:0;height:10px;background:var(--acc);width:0}
  #mark{position:absolute;top:70px;left:110px;font-size:34px;font-weight:800;letter-spacing:.28em;color:#6b7078}
</style></head>
<body><div id="stage">
  <div class="grain"></div>
  <div id="mark"></div>
  <div id="scenes"></div>
  <div class="cap" id="cap"></div>
  <div class="capbar" id="capbar"></div>
  <div id="prog"></div>
</div>
<script src="data.js"></script>
<script>
var R=window.REEL;var DUR=R.dur;
document.documentElement.style.setProperty('--acc',R.accent||'#34E3C8');
if(R.warn)document.documentElement.style.setProperty('--warn',R.warn);
document.getElementById('mark').innerHTML=(R.brand||'YASIR')+'<span style="color:var(--acc)"> &middot;</span>';

function fmtInline(s){s=String(s==null?'':s);
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/\n/g,'<br>');
  s=s.replace(/\*([^*]+)\*/g,'<span class="acc">$1</span>');
  s=s.replace(/~([^~]+)~/g,'<span class="warn">$1</span>');
  s=s.replace(/_([^_]+)_/g,'<span class="mut">$1</span>');
  return s;}
function lines(arr){return (arr||[]).map(fmtInline).join('<br>');}
function fmtVal(v,n){var d=(n.decimals!=null?n.decimals:0);var s=v.toFixed(d);
  if(n.dropZeros&&s.indexOf('.')>=0)s=s.replace(/\.?0+$/,'');
  return (n.prefix||'')+s+(n.suffix||'');}

var scenesEl=document.getElementById('scenes');
var S=[];
R.scenes.forEach(function(sc){
  var el=document.createElement('div');el.className='scene'+(sc.type==='bars'?' top':'');
  var refs={};var html='';
  if(sc.type==='stat'){
    if(sc.kicker)html+='<div class="kick">'+fmtInline(sc.kicker)+'</div>';
    html+='<div class="h2" style="margin-top:30px">'+lines(sc.headline)+'</div>';
    html+='<div class="big acc" data-num="1" style="margin-top:26px">0</div>';
    if(sc.sub)html+='<div class="sub" style="margin-top:28px">'+fmtInline(sc.sub)+'</div>';
  }else if(sc.type==='statement'){
    if(sc.kicker)html+='<div class="kick" style="margin-bottom:28px">'+fmtInline(sc.kicker)+'</div>';
    html+='<div class="h1">'+lines(sc.headline)+'</div>';
    if(sc.sub)html+='<div class="sub" style="margin-top:46px">'+fmtInline(sc.sub)+'</div>';
    if(sc.sub2)html+='<div class="h2" style="margin-top:56px">'+lines(sc.sub2)+'</div>';
  }else if(sc.type==='bars'){
    html+='<div class="h2">'+lines(sc.headline)+'</div>';
    html+='<div class="barwrap">';
    (sc.bars||[]).forEach(function(b,i){
      var col=b.color==='acc'?'var(--acc)':(b.color||(i===0?'var(--acc)':'#3a4048'));
      var vcls=(b.color==='acc'||i===0)?'acc':'mut';
      html+='<div class="barcol"><div class="barval '+vcls+'" data-bv="1">0</div>'
        +'<div class="bar" data-bar="1" data-h="'+(b.value)+'" data-max="'+(b.max||100)+'" style="background:'+col+';height:0"></div>'
        +'<div class="barlbl">'+lines(b.label)+'</div></div>';
    });
    html+='</div>';
  }else if(sc.type==='list'){
    html+='<div class="h1">'+lines(sc.headline)+'</div>';
    html+='<div style="margin-top:56px">';
    (sc.items||[]).forEach(function(it,i){
      var dc=sc.dotColor||'var(--warn)';
      html+='<div class="risk" data-item="'+i+'" style="opacity:0"><span class="dot" style="background:'+dc+';box-shadow:0 0 0 10px '+dc+'22"></span>'+fmtInline(it)+'</div>';
    });
    html+='</div>';
  }else if(sc.type==='bignum'){
    html+='<div class="big acc" data-num="1">0</div>';
    if(sc.headline)html+='<div class="h2" style="margin-top:10px">'+lines(sc.headline)+'</div>';
    if(sc.sub)html+='<div class="sub" style="margin-top:54px">'+fmtInline(sc.sub)+'</div>';
  }else if(sc.type==='outro'){
    html+='<div class="h1">'+lines(sc.headline)+'</div>';
    if(sc.byline)html+='<div class="kick" style="margin-top:64px">'+fmtInline(sc.byline)+'</div>';
  }
  el.innerHTML=html;scenesEl.appendChild(el);
  refs.num=el.querySelector('[data-num]');
  refs.bars=[].slice.call(el.querySelectorAll('[data-bar]'));
  refs.bvals=[].slice.call(el.querySelectorAll('[data-bv]'));
  refs.items=[].slice.call(el.querySelectorAll('[data-item]'));
  S.push({el:el,sc:sc,refs:refs});
});

function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function eo(x){x=clamp(x,0,1);return 1-Math.pow(1-x,3);}
function lerp(a,b,x){return a+(b-a)*x;}

function seek(t){
  t=clamp(t,0,DUR);
  for(var i=0;i<S.length;i++){
    var o=S[i],sc=o.sc;
    var a=0,y=40;
    if(t>=sc.start&&t<=sc.end){
      var inA=eo((t-sc.start)/0.45);
      var outA=1-eo((t-(sc.end-0.38))/0.38);
      a=clamp(Math.min(inA,outA),0,1);
      y=lerp(40,0,eo((t-sc.start)/0.6));
    }
    o.el.style.opacity=a;o.el.style.transform='translateY('+y+'px)';
    if(a<=0)continue;
    // number counter
    if(o.refs.num&&sc.number){
      var n=sc.number,dur=(n.dur||3.2);
      var p=eo((t-(sc.start+0.6))/dur);
      o.refs.num.textContent=fmtVal(lerp(n.from!=null?n.from:0,n.to,p),n);
    }
    // bars
    if(o.refs.bars.length){
      var bp=eo((t-(sc.start+0.5))/1.9);
      for(var b=0;b<o.refs.bars.length;b++){
        var be=o.refs.bars[b],val=+be.getAttribute('data-h'),mx=+be.getAttribute('data-max');
        be.style.height=lerp(0,470*(val/mx),bp)+'px';
        if(o.refs.bvals[b])o.refs.bvals[b].textContent=Math.round(lerp(0,val,bp));
      }
    }
    // list stagger
    for(var k=0;k<o.refs.items.length;k++){
      var rp=clamp(eo((t-(sc.start+1.2+k*0.95))/0.55),0,1);
      o.refs.items[k].style.opacity=rp;
      o.refs.items[k].style.transform='translateX('+lerp(-34,0,rp)+'px)';
    }
  }
  // captions
  var capEl=document.getElementById('cap'),cb=document.getElementById('capbar'),ct='',cp=0;
  for(var c=0;c<S.length;c++){var sc2=S[c].sc;if(sc2.caption&&t>=sc2.start&&t<sc2.end){ct=sc2.caption;cp=clamp((t-sc2.start)/(sc2.end-sc2.start),0,1);break;}}
  capEl.innerHTML=fmtInline(ct);cb.style.width=lerp(0,860,cp)+'px';
  document.getElementById('prog').style.width=(t/DUR*1080)+'px';
}
window.seek=seek;seek(0);
</script></body></html>

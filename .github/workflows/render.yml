name: Render reel

# Triggered three ways:
#  - repository_dispatch (event_type: render-reel) -> from n8n via the GitHub API
#  - workflow_dispatch -> manual run from the Actions tab (paste a JSON payload)
#  - push to render/** or payload.example.json -> renders the example (smoke test)
on:
  repository_dispatch:
    types: [render-reel]
  workflow_dispatch:
    inputs:
      payload:
        description: "Reel JSON payload (leave blank to render the example)"
        required: false
        default: ""
  push:
    paths:
      - "render/**"
      - "payload.example.json"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Resolve payload
        env:
          DISPATCH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          python - <<'PY'
          import os, json
          dp = (os.environ.get("DISPATCH_PAYLOAD") or "").strip()
          ip = (os.environ.get("INPUT_PAYLOAD") or "").strip()
          payload = None
          if dp and dp not in ("null", "{}", ""):
              payload = json.loads(dp)
          elif ip:
              payload = json.loads(ip)
          else:
              payload = json.load(open("payload.example.json"))
          json.dump(payload, open("_payload.json", "w"))
          print("resolved payload — scenes:", len(payload.get("scenes", [])))
          PY

      - name: Build reel
        run: python render/build.py --payload _payload.json --out reel.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: reel.mp4
          retention-days: 7

      - name: Deliver to n8n
        env:
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
        run: python render/notify.py --file reel.mp4 --payload _payload.json

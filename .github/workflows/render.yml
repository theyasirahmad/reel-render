name: Render reel

on:
  repository_dispatch:
    types: [render-reel]
  workflow_dispatch:
    inputs:
      payload:
        description: "Reel payload JSON (optional; uses payload.example.json if blank)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["render/**", "project/**", ".github/workflows/render.yml", "payload.example.json"]

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Resolve payload
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          python - <<'PY'
          import os, json
          cp = os.environ.get("CLIENT_PAYLOAD", "").strip()
          ip = os.environ.get("INPUT_PAYLOAD", "").strip()
          data = None
          if cp and cp not in ("null", "{}"):
              data = json.loads(cp)
          elif ip:
              data = json.loads(ip)
          else:
              data = json.load(open("payload.example.json"))
          json.dump(data, open("payload.json", "w"))
          print("scenes:", len(data.get("scenes", [])), "title:", (data.get("meta") or {}).get("title"))
          PY

      - name: Install HyperFrames + Chrome
        run: |
          npx --yes hyperframes@0.9.81 browser ensure

      - name: Build reel
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
        run: |
          python render/build.py --payload payload.json --out reel.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: reel.mp4
          if-no-files-found: error

      - name: Deliver to n8n (no-ops if N8N_CALLBACK_URL secret is unset)
        env:
          N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
        run: |
          python render/notify.py --file reel.mp4 --payload payload.json
